# The graph's clock, fixed at one of neswire's packets per cycle.
#
# 240 frames is neswire's 5 ms Opus packet, and the graph runs exactly that:
# one cycle, one packet, nothing re-cut and nothing carried over.
#
# Fixed rather than floored, because a floor never applied. The previous rule
# set min-quantum to 256 for virtual machines, matched on `cpu.vm.name`, which
# PipeWire fills in from DMI -- and nesbox exposes no DMI, so the rule never
# matched. The graph then took neswire's 240-frame request and rounded it down
# to a power of two, 128 frames: a 2.67 ms cycle that a busy guest's timer and
# scheduler miss about twenty times a second. Each missed cycle is audio that
# never reaches neswire, and the stream ran about 3.5% short of realtime --
# measured 2026-10-07 as 193 packets a second where 200 were due, with
# `pw-top` counting the xruns on neswire.
#
# `clock.power-of-two-quantum = false` is what lets 240 stand: with it on,
# PipeWire rounds every quantum down to a power of two. min and max are both
# 240 so no client can move the graph off it -- a game asking for 480 runs at
# 240 like everything else.
context.properties = {
    clock.power-of-two-quantum = false
    default.clock.rate         = 48000
    default.clock.quantum      = 240
    default.clock.min-quantum  = 240
    default.clock.max-quantum  = 240
}

# pipewire.conf ships a rule raising min-quantum to 1024 on any VM it can
# recognise. nesbox is not one it recognises today; if that changes, the rule
# would put min-quantum above max-quantum. This one runs after it and holds 240.
context.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = {
            update-props = {
                default.clock.min-quantum = 240
            }
        }
    }
]

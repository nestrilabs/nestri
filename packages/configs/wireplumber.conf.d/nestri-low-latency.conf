{
  "wireplumber.modules": [
    {
      "name": "libpipewire-module-loopback",
      "args": {
        "audio.format": "F32LE",
        "audio.rate": 48000,
        "audio.channels": 2,
        "channel_map": "front-left,front-right",
        "latency": 128
      }
    }
  ],

  "wireplumber.rules": [
    {
      "description": "Global audio format and rate for all virtual nodes",
      "matches": [
        { "media.class": "Audio/Sink" },
        { "media.class": "Audio/Source" }
      ],
      "apply_properties": {
        "audio.format": "F32LE",
        "audio.rate": 48000,
        "audio.channels": 2,
        "session.suspend-timeout-seconds": 0
      }
    },

    {
      "description": "PulseAudio bridge specific tweaks",
      "matches": [
        { "node.name": "pulse_sink" },
        { "node.name": "pulse_source" }
      ],
      "apply_properties": {
        "pulse.min.req": 128,
        "pulse.max.req": 256,
        "pulse.idle.timeout": 0
      }
    }
  ]
}
